<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140a10" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Bold Syne-inspired Display Letter "S" -->
  <text
    x="31"
    y="46"
    font-family="'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="40"
    fill="url(#crimsonGrad)"
    text-anchor="middle"
    letter-spacing="-1"
    filter="url(#glow)"
  >S</text>

  <!-- Tech Glowing Dot Accent -->
  <circle cx="47" cy="17" r="3.5" fill="#ff3366" />
</svg>
